name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries
    if: github.ref_type == 'tag' && github.repository_owner == 'Wayazi'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact_name: aperture-router
            asset_name: aperture-router-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            artifact_name: aperture-router
            asset_name: aperture-router-aarch64-linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --features wizard --target ${{ matrix.target }}

      - name: Strip binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/aperture-router || true
          else
            strip target/${{ matrix.target }}/release/aperture-router || true
          fi

      - name: Create archive
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset_name }}.tar.gz aperture-router
          cd ../../..

      - name: Generate checksums
        run: |
          sha256sum ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Immutable releases freeze the moment a release is published, so the
      # assets MUST be uploaded in the same call that creates the release;
      # create-then-upload (softprops/action-gh-release) fails with 422.
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          cat > release-notes.md <<'EOF'
          ## Aperture Router @VERSION@

          ### Installation

          #### Linux (x86_64)
          ```bash
          wget https://github.com/Wayazi/aperture-router/releases/download/@VERSION@/aperture-router-x86_64-linux.tar.gz
          tar xzf aperture-router-x86_64-linux.tar.gz
          sudo cp aperture-router /usr/local/bin/
          ```

          #### Linux (aarch64)
          ```bash
          wget https://github.com/Wayazi/aperture-router/releases/download/@VERSION@/aperture-router-aarch64-linux.tar.gz
          tar xzf aperture-router-aarch64-linux.tar.gz
          sudo cp aperture-router /usr/local/bin/
          ```

          #### Cargo
          ```bash
          cargo install aperture-router
          ```

          #### AUR (Arch Linux)
          ```bash
          yay -S aperture-router
          ```

          ### Verification

          Verify the download with SHA256:
          ```bash
          sha256sum -c aperture-router-*-linux.sha256
          ```

          ### What's Changed

          See [CHANGELOG.md](https://github.com/Wayazi/aperture-router/blob/main/CHANGELOG.md) for details.
          EOF
          sed -i "s/@VERSION@/${VERSION}/g" release-notes.md
          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --notes-file release-notes.md \
            artifacts/*/*.tar.gz artifacts/*/*.sha256 \
          || gh release upload "${VERSION}" --clobber artifacts/*/*.tar.gz artifacts/*/*.sha256
